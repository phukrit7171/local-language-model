services:
  local-language-model:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda13
    devices:
      - nvidia.com/gpu=all
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro,z
    command:
      [
        "-s",
        "-m",
        "/models/Qwythos-9B-Claude-Mythos-5-1M-MTP-Q4_K_M.gguf",
        "--mmproj",
        "/models/mmproj-Qwythos-9B-Claude-Mythos-5-1M-f16.gguf",
        "--spec-type",
        "draft-mtp",
        "--spec-draft-n-max",
        "2",
        "--reasoning-preserve",
        "-b",
        "4096",
        "-ub",
        "2048",
        "-fa",
        "on",
        "-c",
        "32768",
        "--image-min-tokens",
        "1024",
        "-ngl",
        "999",
        "--port",
        "8080",
        "--host",
        "::",
      ]

  local-embeddings:
    image: ghcr.io/ggml-org/llama.cpp:full-rocm
    environment:
      # สำคัญที่สุด: ทริคหลอก ROCm ให้ยอมรันบน RDNA3 iGPU (8500G)
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    devices:
      # ต้อง Passthrough อุปกรณ์เหล่านี้เข้าไปใน Container เพื่อให้เข้าถึงฮาร์ดแวร์ AMD ได้
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      # ให้สิทธิ์ Container ในการเข้าถึงกลุ่มฮาร์ดแวร์เร่งความเร็วบน Linux
      - video
      - render
    ports:
      - "8081:8081"
    volumes:
      - ./models:/models:ro,z
    command:
      [
        "-s",
        "-m",
        "/models/Qwen.Qwen3-VL-Embedding-2B.Q4_K_M.gguf",
        "--embedding",
        "--image-min-tokens",
        "1024",
        "-fa",
        "on",
        "-b",
        "4096",
        "-ub",
        "2048",
        "-c",
        "32768",
        "-ngl",
        "999",
        "--port",
        "8081",
        "--host",
        "::",
      ]
