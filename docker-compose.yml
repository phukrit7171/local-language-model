services:
  local-language-model:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda13
    devices:
      - nvidia.com/gpu=all
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro,z
    command:
      [
        "-s",
        "-m",
        "/models/Qwen3.6-27B-UD-IQ3_XXS.gguf",
        "--mmproj",
        "/models/mmproj-Qwen3.6-27B-BF16.gguf",
        "--reasoning-preserve",
        "--api-key",
        "${API_KEY}",
        "-b",
        "4096",
        "-ub",
        "2048",
        "-fa",
        "on",
        "-c",
        "32768",
        "--image-min-tokens",
        "1024",
        "-ngl",
        "999",
        "--port",
        "8080",
        "--host",
        "::",
      ]

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    dns:
      - 1.1.1.1
      - 8.8.8.8

  local-embeddings:
    image: ghcr.io/ggml-org/llama.cpp:full-rocm
    environment:
      # สำคัญที่สุด: ทริคหลอก ROCm ให้ยอมรันบน RDNA3 iGPU (8500G)
      - HSA_OVERRIDE_GFX_VERSION=11.0.0
    devices:
      # ต้อง Passthrough อุปกรณ์เหล่านี้เข้าไปใน Container เพื่อให้เข้าถึงฮาร์ดแวร์ AMD ได้
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      # ให้สิทธิ์ Container ในการเข้าถึงกลุ่มฮาร์ดแวร์เร่งความเร็วบน Linux
      - video
      - render
    ports:
      - "8081:8081"
    volumes:
      - ./models:/models:ro,z
    command:
      [
        "-s",
        "-m",
        "/models/Qwen.Qwen3-VL-Embedding-2B.Q4_K_M.gguf",
        "--mmproj",
        "/models/mmproj-Qwen.Qwen3-VL-Embedding-2B.f16.gguf",
        "--embedding",
        "--pooling",
        "last",
        "--image-min-tokens",
        "512",
        "-fa",
        "on",
        "-c",
        "10240",
        "-ngl",
        "999",
        "--port",
        "8081",
        "--host",
        "::",
      ]

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
volumes:
  open-webui:
