services:
  local-language-model:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda13
    devices:
      - nvidia.com/gpu=all
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro,z
    restart: always
    command: [
        "-s",
        "-m",
        "/models/Qwythos-9B-v2-MTP-Q4_K_M.gguf",
        "--cache-type-k",
        "q8_0",
        "--cache-type-v",
        "q8_0",
        "--mmproj",
        "/models/mmproj-Qwythos-9B-v2-BF16.gguf",
        "-fa",
        "on",
        "-c",
        "32768",
        "-ngl",
        "99",
        "--port",
        "8080",
        "--host",
        "::",
      ]
